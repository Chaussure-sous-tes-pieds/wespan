  <!-- deux écrans, dont un vertical, avec une image continue -->
  <rect x="3" y="16" width="38" height="24" rx="2.5" fill="#20242b"/>
  <rect x="44" y="6" width="17" height="44" rx="2.5" fill="#20242b"/>
