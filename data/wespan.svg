<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f8f"/><stop offset="0.6" stop-color="#4a7fd4"/><stop offset="1" stop-color="#f3b983"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fd0"/><stop offset="1" stop-color="#16427e"/>
